spring:
  application:
    name: exam-service

  datasource:
    url: jdbc:oracle:thin:@localhost:1522/XEPDB1
    username: ${DB_USERNAME:radiology_user}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.OracleDialect